<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hokkaido Winter 8D</title>
    <style>
        :root { --sky-blue-top: #90caf9; --sky-blue-mid: #e3f2fd; --snow-ground: #f0f8ff; --text-dark: #2c3e50; --accent-blue: #1565c0; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: linear-gradient(180deg, var(--sky-blue-top) 0%, var(--sky-blue-mid) 40%, var(--snow-ground) 100%); background-attachment: fixed; margin: 0; padding: 15px; padding-bottom: 160px; color: var(--text-dark); min-height: 100vh; }
        body::before { content: "❄ ❄ ❄"; color: white; position: fixed; top: -10%; left: 5%; font-size: 22px; animation: snow 15s linear infinite; opacity: 0.9; z-index: -1; text-shadow: 0 0 5px rgba(255,255,255,0.8); }
        @keyframes snow { 0% { transform: translateY(-10vh) rotate(0deg) translateX(0); } 100% { transform: translateY(110vh) rotate(360deg) translateX(50px); } }
        .card { background: rgba(255, 255, 255, 0.85); border-radius: 24px; padding: 20px; box-shadow: 0 8px 25px rgba(144, 202, 249, 0.25); margin-bottom: 20px; backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.6); }
        h3 { margin-top: 0; color: var(--accent-blue); font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        input, select { padding: 12px; border: 2px solid #e3f2fd; border-radius: 12px; font-size: 15px; flex: 1; min-width: 120px; box-sizing: border-box; background: rgba(255,255,255,0.95); }
        button { cursor: pointer; border: none; border-radius: 12px; padding: 14px; font-weight: bold; width: 100%; }
        .btn-add { background: linear-gradient(45deg, #42a5f5, #64b5f6); color: white; }
        .btn-map { background: #fff; color: #1565c0; border: 1px solid #1565c0; padding: 10px; font-size: 0.9rem; border-radius: 10px; width: auto; }
        .day-title { font-weight: bold; color: white; background: #64b5f6; padding: 5px 15px; border-radius: 20px; display: inline-block; margin: 15px 0 10px 0; font-size: 0.85rem; }
        .item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid #bbdefb; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .item-info { font-size: 0.85rem; color: #546e7a; margin-top: 4px; }
        .time-tag { color: #e65100; font-weight: bold; font-size: 0.8rem; background: #fff3e0; padding: 2px 8px; border-radius: 5px; }
        .del-btn { color: #e57373; background: none; border: 1px solid #ffcdd2; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; }
        .summary-bar { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); padding: 15px 20px; text-align: center; border-radius: 25px; box-shadow: 0 10px 30px rgba(21, 101, 192, 0.15); border: 1px solid rgba(255,255,255,0.8); z-index: 1000; }
        .total-text { color: var(--accent-blue); font-size: 1.6rem; font-weight: 900; }
        .img-preview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h3>❄️ 北海道 8D7N 預算管家</h3>
    <div class="row">
        <div style="flex:1"><small>日幣匯率</small><input type="number" id="exRate" value="0.22" step="0.001" oninput="update()"></div>
        <div style="flex:1"><small>機票總額(NT)</small><input type="number" id="flight" value="21255" oninput="update()"></div>
    </div>
    <div class="row">
        <div style="flex:2"><small>住宿總額(日幣)</small><input type="text" id="hotelTotal" value="97742 + 276517" placeholder="例如: 100+200" oninput="update()"></div>
        <div style="flex:1"><small>人數</small><input type="number" id="peopleCount" value="6" oninput="update()"></div>
    </div>
</div>

<div class="card">
    <h3>📝 新增行程</h3>
    <div class="row">
        <select id="dayP" style="flex:1">
            <option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option>
            <option value="5">Day 5</option><option value="6">Day 6</option><option value="7">Day 7</option><option value="8">Day 8</option>
        </select>
        <input type="text" id="itemName" placeholder="景點名稱" style="flex:2">
        <button class="btn-map" onclick="searchMap()">🔍 查地圖/時間</button>
    </div>
    <div class="row">
        <input type="number" id="itemPrice" placeholder="金額">
        <select id="curT" style="width: 90px;"><option value="f">日幣</option><option value="t">台幣</option></select>
        <input type="text" id="itemTime" placeholder="⏰ 營業時間 (如 09:00-17:00)">
    </div>
    <div class="row">
        <input type="text" id="itemNote" placeholder="備註或網址">
        <input type="text" id="itemImg" placeholder="🖼️ 圖片網址 (選填)">
    </div>
    <button class="btn-add" onclick="add()">💾 儲存行程項目</button>
    <div id="itList"></div>
</div>

<div class="summary-bar">
    <div style="font-size:0.8rem; color:#546e7a;">個人估計總支出 (NT)</div>
    <span class="total-text" id="gTotal">0</span>
</div>

<script>
    // 預先 key 入的行程項目
    const defaultItems = [
        {day: 1, n: "登別水族館門票", p: 612, t: "t", time: "09:00-17:00", note: "門票"},
        {day: 2, n: "熊牧場門票", p: 3200, t: "f", time: "09:30-16:30", note: "登別景點"},
        {day: 4, n: "天狗山門票", p: 449, t: "t", time: "09:00-21:00", note: "纜車"},
        {day: 5, n: "滑雪教學(方案1)", p: 4500, t: "t", time: "4小時", note: "雙板入門"},
        {day: 6, n: "旭山動物園一日遊", p: 1838, t: "t", time: "全天", note: "KKday"},
        {day: 7, n: "美唄雪上樂園門票", p: 2000, t: "f", time: "09:00-16:15", note: "雪上活動"}
    ];

    let items = JSON.parse(localStorage.getItem('h_it_v8')) || defaultItems;

    window.onload = function() { render(); };

    function searchMap() {
        const n = document.getElementById('itemName').value;
        if(!n) return alert("請輸入景點名稱");
        window.open(`https://www.google.com/maps/search/${encodeURIComponent(n)}`, '_blank');
    }

    function add() {
        const d = document.getElementById('dayP').value, n = document.getElementById('itemName').value, p = parseFloat(document.getElementById('itemPrice').value)||0, t = document.getElementById('curT').value, time = document.getElementById('itemTime').value, note = document.getElementById('itemNote').value, img = document.getElementById('itemImg').value;
        if(!n) return;
        items.push({day: parseInt(d), n, p, t, time, note, img});
        items.sort((a,b) => a.day - b.day);
        document.getElementById('itemName').value=''; document.getElementById('itemPrice').value=''; document.getElementById('itemTime').value=''; document.getElementById('itemNote').value=''; document.getElementById('itemImg').value='';
        render();
    }

    function remove(i) { items.splice(i, 1); render(); }

    function render() {
        const listDiv = document.getElementById('itList');
        listDiv.innerHTML = '';
        const days = [...new Set(items.map(i => i.day))].sort((a,b)=>a-b);
        days.forEach(day => {
            let dayHtml = `<div class="day-title">Day ${day}</div>`;
            items.forEach((it, idx) => {
                if(it.day === day) {
                    dayHtml += `<div class="item">
                        <div class="item-top">
                            <div style="font-weight:bold;">${it.n} <span style="color:#1565c0">(${it.p}${it.t=='f'?'円':'元'})</span></div>
                            <button class="del-btn" onclick="remove(${idx})">刪除</button>
                        </div>
                        ${it.time ? `<div class="time-tag">⏰ ${it.time}</div>` : ''}
                        <div class="item-info">${it.note || ''}</div>
                        ${it.img ? `<img src="${it.img}" class="img-preview">` : ''}
                        <div style="margin-top:8px;"><a href="https://www.google.com/maps/search/${encodeURIComponent(it.n)}" target="_blank" style="text-decoration:none; font-size:0.8rem; color:#1565c0;">🗺️ 查看路線/時間</a></div>
                    </div>`;
                }
            });
            listDiv.innerHTML += dayHtml;
        });
        update();
    }

    function update() {
        const r = parseFloat(document.getElementById('exRate').value)||1, f = parseFloat(document.getElementById('flight').value)||0, pC = parseFloat(document.getElementById('peopleCount').value)||1;
        const hVal = document.getElementById('hotelTotal').value;
        let hT = 0;
        try { hT = eval(hVal.replace(/[^\d+*/.-]/g, '')) || 0; } catch(e) { hT = 0; }
        
        localStorage.setItem('h_f_v8', f);
        localStorage.setItem('h_h_v8', hVal);
        localStorage.setItem('h_it_v8', JSON.stringify(items));

        let dTotal = items.reduce((s, i) => s + (i.t=='f' ? i.p*r : i.p), 0);
        const gTotal = Math.round(f + (hT * r / pC) + dTotal);
        document.getElementById('gTotal').innerText = gTotal.toLocaleString();
    }
</script>
</body>
</html>
