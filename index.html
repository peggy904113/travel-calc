<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊預算計算機</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f5f7f9; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 120px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; border-left: 5px solid var(--primary); padding-left: 10px; }
        .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .sub-text { font-size: 0.85rem; color: #666; margin-bottom: 10px; background: #fdf2f2; padding: 5px 10px; border-radius: 5px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; width: 100%; }
        .btn-map { background: #4285F4; color: white; text-decoration: none; display: block; text-align: center; margin-top: 5px; font-size: 0.9rem; padding: 10px; border-radius: 8px; }
        .btn-copy { background: #28a745; color: white; width: 100%; margin-top: 10px; }
        .item-list { border-top: 1px solid #eee; margin-top: 10px; }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 0.95rem; }
        .del-btn { color: #dc3545; background: none; border: 1px solid #dc3545; padding: 2px 8px; border-radius: 4px; }
        .summary-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #2c3e50; color: white; padding: 15px; text-align: center; box-sizing: border-box; z-index: 1000; }
        .total-text { color: #f1c40f; font-size: 1.6rem; font-weight: bold; }
        .rate-info { background: #fff3cd; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="card rate-info">
    <h3>💹 匯率與固定大項</h3>
    <div class="row"><small>1 外幣 = </small><input type="number" id="exRate" value="0.22" step="0.001" oninput="update()"> <small>TWD</small></div>
    <div class="row"><input type="number" id="flight" placeholder="機票個人金額 (台幣)" oninput="update()"></div>
    <div style="border-top: 1px solid #eeb; padding-top: 10px; margin-top: 5px;">
        <div class="row">
            <input type="number" id="hotelTotal" placeholder="住宿總金額 (台幣)" oninput="update()">
            <input type="number" id="peopleCount" value="6" oninput="update()" style="width: 80px;">
            <span>人分</span>
        </div>
        <div id="hotelSplitResult" class="sub-text">住宿每人：0 TWD</div>
    </div>
</div>

<div class="card">
    <h3>🗺️ 查價導航 (Google Maps)</h3>
    <input type="text" id="sLoc" placeholder="起點" style="margin-bottom:5px;">
    <input type="text" id="eLoc" placeholder="終點">
    <button class="btn-map" style="width:100%;" onclick="goMap()">開啟地圖查票價 ↗</button>
</div>

<div class="card">
    <h3>💸 交通/活動支出</h3>
    <input type="text" id="itemName" placeholder="項目名稱" style="margin-bottom:5px;">
    <div class="row">
        <input type="number" id="itemPrice" placeholder="金額">
        <select id="curType" style="width:120px;"><option value="f">外幣</option><option value="t">台幣</option></select>
    </div>
    <button class="btn-add" onclick="add()">加入清單</button>
    <div id="list" class="item-list"></div>
    <button class="btn-copy" onclick="copy()">複製預算傳給朋友</button>
</div>

<div class="summary-bar">個人總額：<span class="total-text" id="gTotal">0</span> TWD</div>

<script>
    let items = JSON.parse(localStorage.getItem('travel_items')) || [];

    window.onload = function() {
        document.getElementById('flight').value = localStorage.getItem('flight') || '';
        document.getElementById('hotelTotal').value = localStorage.getItem('hotelTotal') || '';
        render();
    };

    function goMap() {
        const s = document.getElementById('sLoc').value, e = document.getElementById('eLoc').value;
        if(!s || !e) return alert("請輸入起點終點");
        window.open(`https://www.google.com/maps/dir/${encodeURIComponent(s)}/${encodeURIComponent(e)}/data=!4m2!4m1!3e3`, '_blank');
    }

    function add() {
        const n = document.getElementById('itemName').value, p = parseFloat(document.getElementById('itemPrice').value)||0, t = document.getElementById('curType').value;
        if(!n) return;
        items.push({n, p, t});
        document.getElementById('itemName').value=''; document.getElementById('itemPrice').value='';
        render();
    }

    function remove(i) { items.splice(i, 1); render(); }

    function render() {
        const l = document.getElementById('list'); l.innerHTML = '';
        items.forEach((it, i) => {
            l.innerHTML += `<div class="item"><span>${it.n} (${it.p}${it.t=='f'?'外':'台'})</span><button class="del-btn" onclick="remove(${i})">刪除</button></div>`;
        });
        update();
    }

    function update() {
        const r = parseFloat(document.getElementById('exRate').value)||1;
        const f = parseFloat(document.getElementById('flight').value)||0;
        const hTotal = parseFloat(document.getElementById('hotelTotal').value)||0;
        const pCount = parseFloat(document.getElementById('peopleCount').value)||1;
        const hPerPerson = Math.round(hTotal / pCount);
        
        localStorage.setItem('flight', f);
        localStorage.setItem('hotelTotal', hTotal);
        localStorage.setItem('travel_items', JSON.stringify(items));

        document.getElementById('hotelSplitResult').innerText = `住宿每人：${hPerPerson.toLocaleString()} TWD`;
        let d = items.reduce((s, i) => s + (i.t=='f' ? i.p*r : i.p), 0);
        document.getElementById('gTotal').innerText = Math.round(f + hPerPerson + d).toLocaleString();
    }

    function copy() {
        let txt = `✈️ 旅遊個人預算\n總計：${document.getElementById('gTotal').innerText} TWD\n---\n`;
        items.forEach(i => txt += `${i.n}: ${i.p}${i.t=='f'?'外幣':'台幣'}\n`);
        navigator.clipboard.writeText(txt).then(() => alert("已複製！"));
    }
</script>
</body>
</html>
