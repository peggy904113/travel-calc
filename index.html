<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hokkaido 8 Days Trip</title>
    <style>
        :root { 
            --sky-blue-top: #90caf9;    
            --sky-blue-mid: #e3f2fd;    
            --snow-ground: #f0f8ff;     
            --text-dark: #2c3e50;
            --accent-blue: #1565c0;
        }
        
        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background: linear-gradient(180deg, var(--sky-blue-top) 0%, var(--sky-blue-mid) 40%, var(--snow-ground) 100%);
            background-attachment: fixed;
            margin: 0; padding: 15px; padding-bottom: 160px;
            color: var(--text-dark); min-height: 100vh;
        }

        /* 雪花特效 */
        body::before {
            content: "❄ ❄ ❄"; color: white; position: fixed; top: -10%; left: 5%; 
            font-size: 22px; animation: snow 15s linear infinite; opacity: 0.9; z-index: -1;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }
        @keyframes snow {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(50px); }
        }

        .card { 
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px; padding: 20px; 
            box-shadow: 0 8px 25px rgba(144, 202, 249, 0.25); 
            margin-bottom: 20px; backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h3 { margin-top: 0; color: var(--accent-blue); font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

        .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        
        input, select { 
            padding: 12px; border: 2px solid #e3f2fd; border-radius: 12px; 
            font-size: 15px; width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,0.95);
        }

        button { cursor: pointer; border: none; border-radius: 12px; padding: 14px; font-weight: bold; width: 100%; }
        .btn-add { background: linear-gradient(45deg, #42a5f5, #64b5f6); color: white; }
        .btn-map { background: #fff; color: #1565c0; border: 1px solid #1565c0; padding: 10px; font-size: 0.9rem; }
        .btn-copy { background: #546e7a; color: white; margin-top: 15px; }

        .day-title { 
            font-weight: bold; color: white; background: #64b5f6; 
            padding: 5px 15px; border-radius: 20px; display: inline-block;
            margin: 15px 0 10px 0; font-size: 0.85rem;
        }
        
        .item { 
            background: white; padding: 12px 15px; border-radius: 12px;
            margin-bottom: 10px; border-left: 4px solid #bbdefb;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;}
        .item-note { font-size: 0.8rem; color: #666; background: #f5f5f5; padding: 6px; border-radius: 6px; word-break: break-all; margin-top: 5px; }
        .del-btn { color: #e57373; background: none; border: 1px solid #ffcdd2; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px;}
        .map-link { color: #1565c0; text-decoration: none; font-size: 0.8rem; font-weight: bold; }

        #textReport { background: #f1f8e9; border-radius: 12px; padding: 12px; white-space: pre-wrap; font-size: 0.85rem; border: 1px dashed #cfd8dc; }

        .summary-bar { 
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            padding: 15px 20px; text-align: center; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(21, 101, 192, 0.15); border: 1px solid rgba(255,255,255,0.8);
            z-index: 1000;
        }
        .total-text { color: var(--accent-blue); font-size: 1.6rem; font-weight: 900; }
    </style>
</head>
<body>

<div class="card">
    <h3>❄️ 北海道八天七夜預算</h3>
    <div class="row">
        <div style="flex:1"><small>日幣匯率</small><input type="number" id="exRate" value="0.22" step="0.001" oninput="update()"></div>
        <div style="flex:1"><small>機票總額(台幣)</small><input type="number" id="flight" placeholder="去+回總額" oninput="update()"></div>
    </div>
    <div class="row">
        <div style="flex:1"><small>住宿總額(台幣)</small><input type="number" id="hotelTotal" placeholder="總計" oninput="update()"></div>
        <div style="flex:1"><small>分攤人數</small><input type="number" id="peopleCount" value="6" oninput="update()"></div>
    </div>
</div>

<div class="card">
    <h3>📝 行程與支出</h3>
    <div class="row">
        <select id="dayP" style="flex:1">
            <option value="1">Day 1 (12/30)</option><option value="2">Day 2 (12/31)</option>
            <option value="3">Day 3 (1/1)</option><option value="4">Day 4 (1/2)</option>
            <option value="5">Day 5 (1/3)</option><option value="6">Day 6 (1/4)</option>
            <option value="7">Day 7 (1/5)</option><option value="8">Day 8 (1/6)</option>
        </select>
        <select id="catP" style="width: 80px;">
            <option value="📍">一般</option><option value="🚌">交通</option>
            <option value="🎫">門票</option><option value="🎿">滑雪</option>
            <option value="🍜">餐飲</option><option value="🛍️">購物</option>
        </select>
    </div>
    <div class="row">
        <input type="text" id="itemName" placeholder="項目名稱 (如: 登別水族館)">
        <button class="btn-map" onclick="searchMap()" style="width: 100px;">🔍 查地圖</button>
    </div>
    <div class="row">
        <input type="number" id="itemPrice" placeholder="金額">
        <select id="curT" style="width: 90px;"><option value="f">日幣</option><option value="t">台幣</option></select>
    </div>
    <div class="row">
        <input type="text" id="itemNote" placeholder="備註或連結 (如: 需預約, https://...)">
    </div>
    <button class="btn-add" onclick="add()">💾 儲存項目</button>
    <div id="itList"></div>
</div>

<div class="card">
    <h3>📜 預算報表</h3>
    <div id="textReport">等待輸入...</div>
    <button class="btn-copy" onclick="copy()">📋 複製報表</button>
</div>

<div class="summary-bar">
    <div style="font-size:0.8rem; color:#546e7a;">個人預估總支出</div>
    <span class="total-text" id="gTotal">0</span> <small>TWD</small>
</div>

<script>
    let items = JSON.parse(localStorage.getItem('h_it_v5')) || [];
    window.onload = function() {
        document.getElementById('flight').value = localStorage.getItem('h_f_v5') || '';
        document.getElementById('hotelTotal').value = localStorage.getItem('h_h_v5') || '';
        render();
    };

    function searchMap() {
        const name = document.getElementById('itemName').value;
        if(!name) { alert("請先輸入地點名稱！"); return; }
        window.open(`https://www.google.com/maps/search/${encodeURIComponent(name)}`, '_blank');
    }

    function add() {
        const d = document.getElementById('dayP').value, cat = document.getElementById('catP').value, n = document.getElementById('itemName').value, p = parseFloat(document.getElementById('itemPrice').value)||0, t = document.getElementById('curT').value, note = document.getElementById('itemNote').value;
        if(!n) return;
        items.push({day: parseInt(d), cat, n, p, t, note});
        items.sort((a,b) => a.day - b.day);
        document.getElementById('itemName').value=''; document.getElementById('itemPrice').value=''; document.getElementById('itemNote').value='';
        render();
    }

    function remove(i) { items.splice(i, 1); render(); }

    function render() {
        const listDiv = document.getElementById('itList');
        listDiv.innerHTML = '';
        const days = [...new Set(items.map(i => i.day))].sort((a,b)=>a-b);
        days.forEach(day => {
            let dayHtml = `<div class="day-title">Day ${day}</div>`;
            items.forEach((it, idx) => {
                if(it.day === day) {
                    let noteHtml = it.note ? `<div class="item-note">${it.note}</div>` : '';
                    dayHtml += `
                    <div class="item">
                        <div class="item-top">
                            <span>${it.cat} ${it.n} (${it.p.toLocaleString()}${it.t=='f'?'円':'元'})</span>
                            <div>
                                <a class="map-link" href="https://www.google.com/maps/search/${encodeURIComponent(it.n)}" target="_blank">🗺️地圖</a>
                                <button class="del-btn" onclick="remove(${idx})" style="margin-left:10px;">刪除</button>
                            </div>
                        </div>
                        ${noteHtml}
                    </div>`;
                }
            });
            listDiv.innerHTML += dayHtml;
        });
        update();
    }

    function update() {
        const r = parseFloat(document.getElementById('exRate').value)||1, f = parseFloat(document.getElementById('flight').value)||0, hT = parseFloat(document.getElementById('hotelTotal').value)||0, pC = parseFloat(document.getElementById('peopleCount').value)||1;
        const hPer = Math.round(hT / pC);
        localStorage.setItem('h_f_v5', f); localStorage.setItem('h_h_v5', hT); localStorage.setItem('h_it_v5', JSON.stringify(items));
        let dTotal = items.reduce((s, i) => s + (i.t=='f' ? i.p*r : i.p), 0);
        const gTotal = Math.round(f + hPer + dTotal);
        document.getElementById('gTotal').innerText = gTotal.toLocaleString();
        let report = `✈️ 北海道8天7夜預算\n機票：${f.toLocaleString()} TWD\n住宿：${hPer.toLocaleString()} TWD\n======================\n`;
        days = [...new Set(items.map(i => i.day))].sort((a,b)=>a-b);
        days.forEach(day => {
            report += `【Day ${day}】\n`;
            items.forEach(it => { if(it.day === day) report += ` ${it.cat} ${it.n}：${it.p.toLocaleString()}${it.t=='f'?'円':'元'}${it.note ? '\n    └ 註：'+it.note : ''}\n`; });
        });
        report += `======================\n💰 預計總花費：${gTotal.toLocaleString()} TWD`;
        document.getElementById('textReport').innerText = report;
    }

    function copy() {
        navigator.clipboard.writeText(document.getElementById('textReport').innerText).then(() => alert("報表已複製！"));
    }
</script>
</body>
</html>
