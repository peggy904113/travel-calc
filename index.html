<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>去北海道被雪玩 V44.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
:root {
    --sky-blue:#e3f2fd; --accent-blue:#1565c0; --orange:#ffa726;
    --text:#2c3e50; --red:#e53935; --gray:#78909c; --light-blue:#f0f7ff;
}
body {
    font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
    background:#f0f4f8; margin:0; padding-bottom:110px;
    color:var(--text); user-select:none; overflow-x:hidden;
}

/* 行程卡片 */
.it-card{
    background:white; border-radius:15px; padding:12px 15px;
    margin-bottom:10px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}
.drag-handle{
    cursor:grab; font-size:18px; color:#90a4ae; user-select:none;
}
.drag-handle:active{ cursor:grabbing; }

.it-time{ min-width:45px; color:var(--accent-blue); font-weight:bold; }
.it-info{ flex:1; display:flex; flex-direction:column; }
.it-name{ font-weight:bold; color:#1a237e; }
.it-trans-sub{ font-size:.75rem; color:var(--gray); margin-top:3px; }

.day-header{
    background:linear-gradient(135deg,#1565c0,#42a5f5);
    color:white; padding:6px 15px; border-radius:20px;
    margin:15px 0 10px; font-size:.8rem; display:inline-block;
}
.page{ display:none; }
.page.active{ display:block; }
.nav-tabs{ display:flex; position:sticky; top:0; background:white; z-index:10; }
.tab{ flex:1; text-align:center; padding:12px; font-weight:bold; cursor:pointer; }
.tab.active{ color:var(--accent-blue); border-bottom:3px solid var(--accent-blue); }
.container{ padding:15px; }
</style>
</head>

<body>

<div class="nav-tabs">
    <div class="tab active" onclick="showPage('itinerary',this)">📅 行程</div>
</div>

<div class="container">
    <div id="itinerary" class="page active">
        <div id="itList"></div>
    </div>
</div>

<script>
let data = {
    itinerary:[
        {n:"札幌車站",time:"10:00",day:1},
        {n:"狸小路",time:"12:00",day:1},
        {n:"小樽運河",time:"09:00",day:2}
    ]
};

window.onload = renderAll;

function renderAll(){
    const itDiv=document.getElementById("itList");
    itDiv.innerHTML="";
    [1,2,3].forEach(d=>{
        itDiv.innerHTML+=`<div class="day-header">Day ${d}</div><div id="day-${d}"></div>`;
        const g=document.getElementById(`day-${d}`);
        data.itinerary.filter(i=>i.day==d).forEach((it,idx)=>{
            g.innerHTML+=`
            <div class="it-card" data-idx="${idx}">
                <div class="drag-handle">☰</div>
                <div class="it-time">${it.time||"--"}</div>
                <div class="it-info">
                    <div class="it-name">${it.n}</div>
                </div>
            </div>`;
        });
        new Sortable(g,{
            group:"days",
            animation:150,
            handle:".drag-handle",
            onEnd:updateOrder
        });
    });
}

function updateOrder(){
    let list=[];
    [1,2,3].forEach(d=>{
        document.querySelectorAll(`#day-${d} .it-card`).forEach(el=>{
            let it={...data.itinerary[el.dataset.idx]};
            it.day=d; list.push(it);
        });
    });
    data.itinerary=list;
}

function showPage(id,el){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
