<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hokkaido Winter Trip</title>
    <style>
        :root { 
            --ice-blue: #e3f2fd;
            --snow-white: #ffffff;
            --deep-blue: #1a2a6c;
            --accent-gold: #f1c40f; /* 像雪地裡的暖陽 */
        }
        
        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); /* 模擬北海道夕陽雪景 */
            background-attachment: fixed;
            margin: 0; padding: 15px; padding-bottom: 140px; color: #2c3e50;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 雪花背景效果 */
        body::before {
            content: "❄"; color: white; position: fixed; top: -10%; left: 10%; font-size: 20px; animation: snow 10s linear infinite; opacity: 0.5;
        }
        @keyframes snow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card { 
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px; padding: 20px; 
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2); 
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h3 { 
            margin-top: 0; color: #0d47a1; font-size: 1.2rem; 
            display: flex; align-items: center; gap: 8px;
        }

        .row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        input, select { 
            padding: 14px; border: 1px solid #c5cae9; border-radius: 15px; 
            font-size: 16px; width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,0.9);
        }

        button { 
            cursor: pointer; border: none; border-radius: 15px; 
            padding: 14px; font-weight: bold; transition: 0.3s;
        }
        .btn-add { background: linear-gradient(45deg, #2196F3, #21CBF3); color: white; width: 100%; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3); }
        .btn-copy { background: #37474f; color: white; width: 100%; margin-top: 15px; }

        .day-title { 
            font-weight: bold; color: white; background: #5c6bc0; 
            padding: 6px 18px; border-radius: 20px; display: inline-block;
            margin: 15px 0 10px 0; font-size: 0.85rem;
        }
        .item { 
            background: white; display: flex; justify-content: space-between; 
            align-items: center; padding: 12px 15px; border-radius: 15px;
            margin-bottom: 8px; border-left: 5px solid #9fa8da;
        }
